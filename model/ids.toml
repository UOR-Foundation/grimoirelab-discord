# model/ids.toml --- the conformance ID register.
#
# Every ID this repository claims, in one place, so that nothing is referenced
# without being defined. `CONFORMANCE.md` is generated from this file. A test
# whose name ends in an ID not listed here fails `check-model`, and an ID listed
# here with no scenario and no test fails it too (CM-02).
#
# `level` is the honesty level (R2):
#   some-true  a fact reproduced from an authority; not established here
#   build      constructed here and validated against its oracle
#   open       measured and reported, never asserted
#
# Every row here has a scenario in `features/suites/` and a test whose name ends
# in the ID, lowercased with underscores (R3, CM-02). There is no "pending"
# state: a capability that is not built does not get a row, and every row in this
# file is built.
#
# The first row is the template's own Prism application in `app/` (TC-01).
# A capability starts with a row here; `just new-capability` writes the row,
# its scenario and its failing test in the order `AGENTS.md` sets out.

spec = "template/1"

[[id]]
id = "PD-01"
level = "build"
suite = "perceval_discord"
statement = "The app never answers paging when response is foreign"

[[id]]
id = "PD-02"
level = "build"
suite = "perceval_discord"
statement = "The app never answers paging when response is stale"

[[id]]
id = "PD-03"
level = "build"
suite = "perceval_discord"
statement = "The app never answers paging when returned is above limit"

[[id]]
id = "PD-04"
level = "build"
suite = "perceval_discord"
statement = "The app never answers paging when remaining is at most floor and sleep is no"

[[id]]
id = "PD-05"
level = "build"
suite = "perceval_discord"
statement = "The app never answers done when state is channel"

[[id]]
id = "PD-06"
level = "build"
suite = "perceval_discord"
statement = "The app always answers failed when response is error and state is not done and state is not refused"

[[id]]
id = "PD-07"
level = "build"
suite = "perceval_discord"
statement = "The app always answers done when state is done"

[[id]]
id = "PD-08"
level = "build"
suite = "perceval_discord"
statement = "The app always answers refused when state is refused"

[[id]]
id = "PD-09"
level = "build"
suite = "perceval_discord"
statement = "The app always answers failed when state is failed"

[[id]]
id = "PD-10"
level = "build"
suite = "perceval_discord"
statement = "The architecture description declares every stakeholder, concern, component, edge, viewpoint and view it references"

[[id]]
id = "PD-11"
level = "build"
suite = "perceval_discord"
statement = "The ISO/IEC 25010 quality model numbers every characteristic, subcharacteristic, requirement and measure, and every parent it names is declared"

[[id]]
id = "PD-12"
level = "build"
suite = "perceval_discord"
statement = "Every compliance obligation is numbered in order and names its evidence"

[[id]]
id = "FR-01"
level = "build"
suite = "frame"
statement = "With a working worker, the page loads and verifies the archive only in that worker before using its identities or guest"

[[id]]
id = "FR-02"
level = "build"
suite = "frame"
statement = "A returning browser whose worker kept an earlier deploy serves this deploy from the navigation that brings its page"
